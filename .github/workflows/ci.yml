name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

# Annule automatiquement les runs obsolètes si une nouvelle modification est poussée sur la PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Typecheck & Architecture
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Run ESLint
        run: npm run lint

      - name: 🛡️ Run TypeScript Typecheck
        run: npm run typecheck

      - name: 📐 Verify Architecture Boundaries (Dependency Cruiser)
        run: npm run arch:check

  test:
    name: Unit & Integration Tests (Jest)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run Tests
        run: npm test -- --ci --coverage --passWithNoTests
